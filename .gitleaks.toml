# Сканер секретів gitleaks для Frequency: ключі, токени, паролі не мають потрапити
# в публічне репо. Запуск — tools/check.sh (крок «Секрети») і хук перед комітом
# (tools/git-pre-commit.sh). Тут — лише стандартні правила + наші відомі «не секрети».

title = "Frequency"

[extend]
useDefault = true

[[allowlists]]
description = "Не секрети: публічний ключ Supabase і імена ключів сховища"
regexes = [
  # Публічний (publishable) ключ Supabase — він і має бути в коді сайту;
  # доступ до даних стережуть правила RLS у базі, а не секретність ключа.
  '''^sb_publishable_[A-Za-z0-9_-]+$''',
  # Імена ключів localStorage на кшталт diary_insights_v1: gitleaks бачить
  # «KEY='…'» і думає, що це ключ API. Справжні ключі так не виглядають.
  '''^[a-z][a-z0-9]*(_[a-z0-9]+)+$''',
]
