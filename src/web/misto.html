:root{padding-top:env(safe-area-inset-top,0px)}

/* ── золота карта: квадрат, пересувається ── */
.stage-wrap.gold{background:#2a2118;justify-content:flex-start;cursor:grab;overscroll-behavior:contain}
.stage-wrap.gold.drag{cursor:grabbing;user-select:none}
.stage.city-g{aspect-ratio:1/1;width:calc(170% * var(--z,1));margin:0 auto}
@media (max-width: 979px){ .stage-wrap.gold{padding:calc(150px + env(safe-area-inset-top,0px)) 0 190px} }
@media (min-width: 980px){ .stage-wrap.gold{align-items:flex-start;justify-content:flex-start} .stage.city-g{width:calc(max(100%, 1100px) * var(--z,1));border-radius:22px;box-shadow:var(--shadow)} .stage-wrap.gold .lstrip{width:100%} }
.stage.city-g .fog{background:radial-gradient(ellipse 70% 60% at 50% 50%,transparent 60%,rgba(60,38,14,.25) 82%,rgba(40,26,10,.55) 100%)}
.stage.city-g .holo{width:12%}
.bld{position:absolute;width:19%;transform:translate(-50%,-58%);pointer-events:none;z-index:1;filter:drop-shadow(0 10px 14px rgba(40,24,6,.45))}
.plot{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px dashed rgba(255,236,200,.9);background:rgba(40,28,14,.72);backdrop-filter:blur(6px);color:#fff3dc;font-size:13px;font-weight:800;box-shadow:0 8px 18px rgba(30,18,4,.4)}
.plot svg{width:32px;height:32px;padding:7px;border-radius:50%;background:#fbbf24;box-sizing:border-box}
.plot.lock{border-style:solid;border-color:rgba(255,236,200,.35);color:#e9d9b8;padding:6px 12px;opacity:.85}
.plot.lock svg{width:auto;height:auto;padding:0;background:none}
.libg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.libc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:800;color:var(--muted);min-height:44px}
.libc img{width:100%;max-width:84px;aspect-ratio:1;object-fit:contain}
.libc.on{border-color:var(--accent);background:rgba(124,147,255,.12);color:var(--text,#e8ebef)}

/* ── кнопка назад у Frequency (сайт, не вбудовано) ── */
@media (max-width: 420px){ .backf span{display:none} }
.onb-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;margin:calc(4px + env(safe-area-inset-top,0px)) 0 4px;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none}
/* ── гаманець у HUD ── */
.rc-w{text-align:left;border:1px solid rgba(74,222,128,.28);color:inherit;font:inherit}
.rc-w .rc-h svg:last-child{margin-left:auto}
/* ── панель Б ── */
.drw-s{position:fixed;inset:0;z-index:40;background:rgba(6,8,11,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.drw-s.on{opacity:1;pointer-events:auto}
.drw{position:fixed;left:0;top:0;bottom:0;z-index:41;width:min(88vw,380px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-right:1px solid var(--line-2);box-shadow:20px 0 40px rgba(0,0,0,.45);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-104%);transition:transform .25s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drw.on{transform:none;visibility:visible}
.drw-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.drw-h .g{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.drw-h .g b{font-size:16px}
.drw-h .g span{font-size:12px;color:var(--muted);font-weight:700}

/* ── створення гравця ── */

.holo-c{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;padding:5px 9px;border-radius:12px;background:rgba(10,16,34,.9);border:1px solid rgba(124,147,255,.55);font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 0 18px rgba(124,147,255,.25)}

  case 'oaddgoal': { var t=$('o-g').value.trim(); if(!t){ $('o-g').focus(); break; } var k=$('o-gl').querySelector('.on').getAttribute('data-k'); O.goals.push({id:uid(),t:t,loc:k,val:(PRESETS[k].vals.filter(function(x){return O.values.indexOf(x)>=0;})[0])||'',p:0}); renderOnb(); break; }
  case 'odelgoal': { var gid=b.getAttribute('data-id'); O.goals=O.goals.filter(function(x){return x.id!==gid;}); renderOnb(); break; }
  case 'oaddwish': { var wt=$('o-wt').value.trim(), wp=parseFloat($('o-wp').value); if(!wt||!wp){ (wt?$('o-wp'):$('o-wt')).focus(); break; } O.wishes.push({id:uid(),t:wt,price:wp,saved:0,i:'gift'}); renderOnb(); break; }
  case 'owrule': O.wishRule=!O.wishRule; renderOnb(); break;
  case 'oloc': OLOC=b.getAttribute('data-k'); renderOnb(); break;
  case 'ostep': { var o=$(b.getAttribute('data-id')); o.textContent=(parseInt(o.textContent,10)||0)+parseInt(b.getAttribute('data-d'),10); break; }
  case 'oaddact': { var n=$('o-an').value.trim(); if(!n){ $('o-an').focus(); break; } ONEW.push({loc:OLOC,name:n,dur:parseInt($('o-ad').querySelector('.on').getAttribute('data-m'),10),energy:parseInt($('o-ae').textContent,10)||0,money:parseInt($('o-am').textContent,10)||0}); renderOnb(); break; }
 }
});
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeSheet(); closeHM(); } });
MQ.addEventListener&&MQ.addEventListener('change',function(){ if(S) render(); });

document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('drw').classList.contains('on')) closeDrw(); });
$('fab').innerHTML=ic('plus','#0c1022',26,2.6);
// Frequency кличе при поверненні у «Мій світ»: Гаманець міг змінитись
window.mistoRefresh=function(){ if(S&&!$('onb').classList.contains('on')) render(); };
S=load();
if(S){ tickDay(); render(); }
else { S=sampleState(); tickDay(); render(); startOnb(false); }
})();
